<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flores Amarillas</title>
<meta name="description" content="Un ramo de flores amarillas virtuales para el 21 de septiembre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0b1026;
    --bg-2: #1b1f47;
    --bg-3: #3a2a55;
    --text: #fff6dc;
    --muted: #d9cfae;
    --gold: #ffc21a;
    --gold-deep: #f0a202;
    --card: rgba(255, 246, 220, 0.08);
    --card-border: rgba(255, 214, 102, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 110%, var(--bg-3) 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    background-color: var(--bg-1);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Cielo ---------- */
  #sky, #petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #sky { z-index: 0; }
  #petals { z-index: 5; }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.7); }
    50% { opacity: .9; transform: scale(1); }
  }

  .firefly {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ffe27a;
    box-shadow: 0 0 10px 3px rgba(255, 210, 60, .6);
    animation: float var(--d, 12s) ease-in-out infinite alternate;
    opacity: .8;
  }
  @keyframes float {
    0%   { transform: translate(0, 0); opacity: .2; }
    30%  { opacity: .9; }
    100% { transform: translate(var(--dx, 40px), var(--dy, -60px)); opacity: .3; }
  }

  .petal {
    position: absolute;
    width: 14px; height: 22px;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: linear-gradient(180deg, #ffe680 0%, var(--gold) 55%, var(--gold-deep) 100%);
    box-shadow: 0 0 6px rgba(255, 200, 40, .35);
    will-change: transform, opacity;
  }

  /* ---------- Layout ---------- */
  main {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 8px;
    min-height: 100vh;
  }

  header { text-align: center; }

  .date {
    font-size: .8rem;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fadeUp 1s ease forwards .2s;
  }

  h1 {
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: clamp(3rem, 11vw, 5.5rem);
    line-height: 1.05;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(255, 194, 26, .45), 0 0 60px rgba(255, 170, 0, .2);
    opacity: 0;
    animation: fadeUp 1.2s ease forwards .5s;
  }

  .dedication {
    min-height: 1.6em;
    font-size: 1.1rem;
    color: var(--text);
    opacity: 0;
    animation: fadeUp 1s ease forwards 1s;
  }
  .dedication strong { color: var(--gold); font-weight: 600; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 560px;
  }

  #bouquet {
    display: block;
    width: 100%;
    height: auto;
    max-height: 68vh;
    overflow: visible;
    filter: drop-shadow(0 0 18px rgba(255, 196, 30, .18));
  }

  .hint {
    font-size: .85rem;
    color: var(--muted);
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s ease forwards 3.2s;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 6px;
  }

  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
  }
  button:hover {
    background: rgba(255, 194, 26, .18);
    box-shadow: 0 0 18px rgba(255, 194, 26, .3);
    transform: translateY(-2px);
  }
  button:active { transform: translateY(0) scale(.97); }
  button.primary {
    background: linear-gradient(135deg, #ffd24a, var(--gold-deep));
    color: #3a2500;
    border-color: transparent;
  }
  button.primary:hover { box-shadow: 0 0 24px rgba(255, 194, 26, .55); }

  /* ---------- Tarjeta para compartir ---------- */
  .share {
    width: 100%;
    max-width: 440px;
    margin-top: 18px;
    padding: 18px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .share h2 {
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: 1.9rem;
    color: var(--gold);
    text-align: center;
    margin-bottom: 10px;
  }
  .share .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .share label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  .share input {
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    background: rgba(0, 0, 0, .25);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 9px 12px;
    outline: none;
    width: 100%;
    min-width: 0;
  }
  .share input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 194, 26, .2); }
  .share button { width: 100%; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 10;
    max-width: calc(100% - 32px);
    transform: translate(-50%, 30px);
    opacity: 0;
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(20, 18, 40, .85);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-align: center;
    font-weight: 500;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
    transition: opacity .4s ease, transform .4s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer { margin-top: 18px; font-size: .75rem; color: var(--muted); opacity: .7; text-align: center; }

  /* ---------- SVG: animaciones del ramo ---------- */
  .stem {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: grow 1.4s ease-out forwards;
    animation-delay: var(--delay, 0s);
  }
  @keyframes grow { to { stroke-dashoffset: 0; } }

  .leaf-inner, .bloom {
    transform: scale(0);
    animation: bloom 1.1s cubic-bezier(.2, 1.5, .4, 1) forwards;
    animation-delay: var(--delay, 0s);
  }
  @keyframes bloom {
    from { transform: scale(0) rotate(-40deg); }
    to   { transform: scale(1) rotate(0deg); }
  }

  .sway {
    animation: sway var(--d, 5s) ease-in-out infinite alternate;
    animation-delay: var(--sd, 0s);
  }
  @keyframes sway {
    from { transform: rotate(-4deg) translateY(0); }
    to   { transform: rotate(4deg) translateY(-3px); }
  }

  .flower { cursor: pointer; }
  .flower .spin { transition: filter .25s ease; }
  .flower:hover .spin { filter: brightness(1.15) drop-shadow(0 0 8px rgba(255, 220, 90, .8)); }
  .spin.pop { animation: pop .9s cubic-bezier(.3, 1.3, .5, 1); }
  @keyframes pop {
    0%   { transform: rotate(0) scale(1); }
    40%  { transform: rotate(200deg) scale(1.3); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .wrap-front { pointer-events: none; }

  /* ---------- Pantalla de regalo y música ---------- */
  .waiting main, .waiting main * { animation-play-state: paused !important; }

  #gift {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px 16px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 60%, rgba(58, 42, 85, .92), rgba(11, 16, 38, .97));
    transition: opacity .8s ease;
  }
  .waiting #gift { display: flex; }
  #gift.leaving { opacity: 0; pointer-events: none; }
  #gift .gift-icon {
    font-size: 4.5rem;
    filter: drop-shadow(0 0 20px rgba(255, 194, 26, .6));
    animation: giftBounce 1.6s ease-in-out infinite;
  }
  @keyframes giftBounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }
  #gift h2 {
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    color: var(--gold);
    text-shadow: 0 0 24px rgba(255, 194, 26, .45);
  }
  #gift p { color: var(--text); font-size: 1.05rem; }
  #gift p strong { color: var(--gold); font-weight: 600; }
  #gift button { margin-top: 8px; font-size: 1.05rem; padding: 12px 26px; }

  #musicBtn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 8;
    width: 44px;
    height: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    font-size: 1.2rem;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #musicBtn.off { opacity: .55; }
  #musicBtn.off::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 2px;
    background: var(--text);
    transform: rotate(-45deg);
    border-radius: 2px;
  }
  #musicBtn.on { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 26, .35); }
    50% { box-shadow: 0 0 0 8px rgba(255, 194, 26, 0); }
  }

  /* Quien recibe las flores no ve las opciones para enviarlas */
  .recipient #addFlower,
  .recipient .share { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .sway, .star, .firefly { animation: none; }
  }

  @media (max-width: 420px) {
    .share .row { flex-direction: column; }
  }
</style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>

  <main>
    <header>
      <p class="date">21 de septiembre</p>
      <h1>Flores amarillas</h1>
      <p class="dedication" id="dedication"></p>
    </header>

    <div class="stage">
      <svg id="bouquet" viewBox="0 0 600 720" role="img" aria-label="Ramo interactivo de flores amarillas">
        <defs>
          <linearGradient id="petalGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#e38b00"/>
            <stop offset=".45" stop-color="#ffbf14"/>
            <stop offset="1" stop-color="#ffe479"/>
          </linearGradient>
          <linearGradient id="petalGradLight" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#f5a800"/>
            <stop offset=".5" stop-color="#ffd23d"/>
            <stop offset="1" stop-color="#fff0a8"/>
          </linearGradient>
          <radialGradient id="centerSun" cx=".45" cy=".4" r=".65">
            <stop offset="0" stop-color="#8a4b12"/>
            <stop offset=".7" stop-color="#4a2508"/>
            <stop offset="1" stop-color="#2c1504"/>
          </radialGradient>
          <radialGradient id="centerDaisy" cx=".4" cy=".35" r=".7">
            <stop offset="0" stop-color="#ffb347"/>
            <stop offset="1" stop-color="#d9620a"/>
          </radialGradient>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7cc46a"/>
            <stop offset="1" stop-color="#2f7a3e"/>
          </linearGradient>
          <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7ecd6"/>
            <stop offset="1" stop-color="#d8c29a"/>
          </linearGradient>
          <linearGradient id="paperFront" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff8e8"/>
            <stop offset=".55" stop-color="#efdfbd"/>
            <stop offset="1" stop-color="#cdb485"/>
          </linearGradient>
          <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffd84d"/>
            <stop offset="1" stop-color="#e59400"/>
          </linearGradient>
        </defs>

        <g id="wrapBack">
          <path d="M96 352 Q300 280 504 352 L336 640 L264 640 Z" fill="url(#paperBack)"/>
          <path d="M96 352 Q300 280 504 352" fill="none" stroke="#fffaf0" stroke-opacity=".6" stroke-width="3"/>
        </g>
        <g id="stems"></g>
        <g id="flowers"></g>
        <g class="wrap-front">
          <path d="M140 420 Q175 438 205 428 Q240 452 272 440 Q300 462 328 440 Q360 452 395 428 Q425 438 460 420 L340 648 L260 648 Z" fill="url(#paperFront)"/>
          <path d="M300 452 L300 648" stroke="#c9ad7c" stroke-opacity=".5" stroke-width="2"/>
          <path d="M205 430 L270 640" stroke="#c9ad7c" stroke-opacity=".35" stroke-width="1.5"/>
          <path d="M395 430 L330 640" stroke="#c9ad7c" stroke-opacity=".35" stroke-width="1.5"/>
          <!-- Moño -->
          <g transform="translate(300 585)">
            <path d="M-6 6 Q-30 60 -48 92 L-30 88 L-24 104 Q-6 56 4 10 Z" fill="url(#ribbon)"/>
            <path d="M6 6 Q30 60 44 96 L28 90 L20 104 Q4 56 -4 10 Z" fill="url(#ribbon)"/>
            <path d="M0 0 Q-60 -44 -70 -6 Q-66 26 0 4 Z" fill="url(#ribbon)"/>
            <path d="M0 0 Q60 -44 70 -6 Q66 26 0 4 Z" fill="url(#ribbon)"/>
            <path d="M-4 0 Q-44 -26 -52 -6" fill="none" stroke="#b86e00" stroke-opacity=".45" stroke-width="2"/>
            <path d="M4 0 Q44 -26 52 -6" fill="none" stroke="#b86e00" stroke-opacity=".45" stroke-width="2"/>
            <ellipse cx="0" cy="2" rx="13" ry="11" fill="#f0a202"/>
            <ellipse cx="-3" cy="-1" rx="5" ry="3.5" fill="#ffe27a" opacity=".7"/>
          </g>
        </g>
      </svg>
    </div>

    <p class="hint">Toca una flor para verla girar ✿ Toca el cielo para soltar pétalos</p>

    <div class="actions">
      <button class="primary" id="addFlower">+ Regalar otra flor</button>
      <button id="shower">Lluvia de pétalos</button>
    </div>

    <section class="share" aria-labelledby="shareTitle">
      <h2 id="shareTitle">Envía tus flores</h2>
      <div class="row">
        <label>Para
          <input id="toInput" type="text" maxlength="40" placeholder="Su nombre" autocomplete="off">
        </label>
        <label>De
          <input id="fromInput" type="text" maxlength="40" placeholder="Tu nombre" autocomplete="off">
        </label>
      </div>
      <button class="primary" id="shareBtn">Crear enlace y compartir</button>
    </section>

    <footer>Flores amarillas virtuales · hechas con cariño</footer>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="gift" role="dialog" aria-modal="true" aria-labelledby="giftTitle">
    <div class="gift-icon" aria-hidden="true">🎁</div>
    <h2 id="giftTitle">Tienes un regalo</h2>
    <p id="giftText">Alguien te mandó flores amarillas</p>
    <button class="primary" id="openGift">Abrir mi regalo 💛</button>
  </div>

  <button id="musicBtn" class="off" aria-label="Reproducir música" aria-pressed="false">♫</button>
  <audio id="music" src="Flores%20Amarillas%20-%20Floricienta.m4a" loop preload="auto"></audio>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("bouquet");
  const stemsLayer = document.getElementById("stems");
  const flowersLayer = document.getElementById("flowers");
  const petalsLayer = document.getElementById("petals");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const BASE = { x: 300, y: 690 };
  const MAX_FLOWERS = 34;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function el(tag, attrs = {}, parent) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  }

  /* ---------------- Cielo: estrellas y luciérnagas ---------------- */
  const sky = document.getElementById("sky");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("span");
    s.className = "star";
    const size = rand(1, 2.6);
    s.style.cssText = `left:${rand(0, 100)}%;top:${rand(0, 75)}%;width:${size}px;height:${size}px;--d:${rand(2, 5)}s;--delay:${rand(0, 5)}s`;
    sky.appendChild(s);
  }
  for (let i = 0; i < 14; i++) {
    const f = document.createElement("span");
    f.className = "firefly";
    f.style.cssText = `left:${rand(0, 100)}%;top:${rand(30, 100)}%;--d:${rand(8, 16)}s;--dx:${rand(-80, 80)}px;--dy:${rand(-120, 20)}px;animation-delay:${rand(0, 6)}s`;
    sky.appendChild(f);
  }

  /* ---------------- Formas de flores ---------------- */
  const PETAL_SUN = "M0 0 C 11 -12, 11 -40, 0 -54 C -11 -40, -11 -12, 0 0 Z";
  const PETAL_DAISY = "M0 0 C 5 -8, 5 -36, 0 -44 C -5 -36, -5 -8, 0 0 Z";
  const PETAL_COSMOS = "M0 0 C 18 -10, 22 -38, 10 -50 Q 5 -44 0 -52 Q -5 -44 -10 -50 C -22 -38, -18 -10, 0 0 Z";

  function drawSunflower(g) {
    const outer = 18, inner = 16;
    for (let i = 0; i < outer; i++) {
      el("path", { d: PETAL_SUN, fill: "url(#petalGrad)", transform: `rotate(${(360 / outer) * i}) translate(0 -14)` }, g);
    }
    for (let i = 0; i < inner; i++) {
      el("path", { d: PETAL_SUN, fill: "url(#petalGradLight)", transform: `rotate(${(360 / inner) * i + 11}) translate(0 -12) scale(.78)` }, g);
    }
    el("circle", { r: 24, fill: "url(#centerSun)" }, g);
    // Semillas en espiral de Fibonacci
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 1; i < 110; i++) {
      const r = 2.1 * Math.sqrt(i);
      if (r > 22) break;
      const a = i * golden;
      el("circle", { cx: (r * Math.cos(a)).toFixed(2), cy: (r * Math.sin(a)).toFixed(2), r: 0.9 + r / 30, fill: i % 3 ? "#6b3a0d" : "#b8741f", opacity: .9 }, g);
    }
  }

  function drawDaisy(g) {
    const n = 24;
    for (let i = 0; i < n; i++) {
      el("path", { d: PETAL_DAISY, fill: i % 2 ? "url(#petalGradLight)" : "url(#petalGrad)", transform: `rotate(${(360 / n) * i}) translate(0 -8)` }, g);
    }
    el("circle", { r: 13, fill: "url(#centerDaisy)" }, g);
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), r = rand(0, 10);
      el("circle", { cx: (r * Math.cos(a)).toFixed(2), cy: (r * Math.sin(a)).toFixed(2), r: 1.1, fill: "#ffe08a", opacity: .8 }, g);
    }
  }

  function drawCosmos(g) {
    const n = 8;
    for (let i = 0; i < n; i++) {
      el("path", { d: PETAL_COSMOS, fill: "url(#petalGradLight)", stroke: "#e89b00", "stroke-width": .6, "stroke-opacity": .5, transform: `rotate(${(360 / n) * i + 22}) translate(0 -4)` }, g);
    }
    for (let i = 0; i < n; i++) {
      el("path", { d: `M0 -6 L0 -26`, stroke: "#e08a00", "stroke-width": 1, "stroke-opacity": .45, transform: `rotate(${(360 / n) * i + 22})` }, g);
    }
    el("circle", { r: 10, fill: "#f08c00" }, g);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      el("circle", { cx: (7 * Math.cos(a)).toFixed(2), cy: (7 * Math.sin(a)).toFixed(2), r: 1.6, fill: "#ffd84d" }, g);
    }
    el("circle", { r: 4, fill: "#8a4b12" }, g);
  }

  function drawBud(g) {
    // Ramita de flores pequeñitas (tipo solidago)
    for (let i = 0; i < 9; i++) {
      const a = rand(0, Math.PI * 2), r = rand(0, 16);
      el("circle", { cx: (r * Math.cos(a)).toFixed(1), cy: (r * Math.sin(a)).toFixed(1), r: rand(3, 5.5).toFixed(1), fill: pick(["#ffd23d", "#ffc21a", "#ffe479"]) }, g);
    }
  }

  const DRAW = { sun: drawSunflower, daisy: drawDaisy, cosmos: drawCosmos, bud: drawBud };

  /* ---------------- Tallos y hojas ---------------- */
  function quadPoint(p0, c, p1, t) {
    const mt = 1 - t;
    return {
      x: mt * mt * p0.x + 2 * mt * t * c.x + t * t * p1.x,
      y: mt * mt * p0.y + 2 * mt * t * c.y + t * t * p1.y
    };
  }

  function addStem(x, y, delay, type) {
    const start = { x: BASE.x + (x - BASE.x) * 0.06 + rand(-6, 6), y: BASE.y };
    const ctrl = { x: BASE.x + (x - BASE.x) * 0.35, y: (BASE.y + y) / 2 + 40 };
    const end = { x, y };
    const width = type === "bud" ? 2.5 : 4.5;

    el("path", {
      d: `M${start.x} ${start.y} Q${ctrl.x} ${ctrl.y} ${end.x} ${end.y}`,
      class: "stem",
      pathLength: 1,
      fill: "none",
      stroke: "#3f8f4a",
      "stroke-width": width,
      "stroke-linecap": "round",
      style: `--delay:${delay}s`
    }, stemsLayer);

    if (type === "bud") return;

    // Una hoja a lo largo del tallo, sólo en la parte visible (sobre el papel)
    const t = rand(0.55, 0.75);
    const p = quadPoint(start, ctrl, end, t);
    const side = x < BASE.x ? -1 : 1;
    const angle = (side > 0 ? 50 : -50) + rand(-15, 15);
    const leaf = el("g", { transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${angle.toFixed(1)})` }, stemsLayer);
    const inner = el("g", { class: "leaf-inner", style: `--delay:${delay + 0.8}s` }, leaf);
    el("path", { d: "M0 0 C 10 -8, 14 -30, 0 -46 C -14 -30, -10 -8, 0 0 Z", fill: "url(#leafGrad)" }, inner);
    el("path", { d: "M0 -2 L0 -40", stroke: "#1f5a2c", "stroke-width": 1, "stroke-opacity": .6 }, inner);
  }

  /* ---------------- Flores ---------------- */
  let flowerCount = 0;

  function addFlower({ x, y, scale = 1, type = "sun", delay = 0 }) {
    addStem(x, y, delay, type);

    const outer = el("g", { transform: `translate(${x} ${y})` }, flowersLayer);
    const sway = el("g", { class: "sway", style: `--d:${rand(3.5, 6).toFixed(2)}s;--sd:${rand(-5, 0).toFixed(2)}s` }, outer);
    const spin = el("g", { class: "spin" }, sway);
    const bloom = el("g", { class: "bloom", style: `--delay:${delay + 1}s` }, spin);
    const body = el("g", { transform: `scale(${scale}) rotate(${rand(0, 360).toFixed(0)})` }, bloom);
    DRAW[type](body);

    if (type !== "bud") {
      outer.classList.add("flower");
      outer.setAttribute("tabindex", "0");
      outer.setAttribute("role", "button");
      outer.setAttribute("aria-label", "Flor amarilla");
      const activate = () => popFlower(outer, spin);
      outer.addEventListener("click", e => { e.stopPropagation(); activate(); });
      outer.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
      });
    }
    flowerCount++;
  }

  const MESSAGES = [
    "Eres mi flor favorita 💛",
    "Que tu día brille como estas flores",
    "Una flor amarilla, un rayito de sol para ti",
    "Florezcamos juntos esta primavera",
    "Contigo todo florece",
    "Te regalo el sol en forma de flor ☀️",
    "Para que nunca te falte alegría",
    "Estas flores no se marchitan, como mi cariño",
    "Amarillas, como la luz que me das",
    "Feliz 21 de septiembre 🌻"
  ];
  let lastMsg = -1;

  function popFlower(outer, spin) {
    spin.classList.remove("pop");
    void spin.getBoundingClientRect(); // reiniciar la animación
    spin.classList.add("pop");

    const r = outer.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 16);

    let i;
    do { i = Math.floor(Math.random() * MESSAGES.length); } while (i === lastMsg && MESSAGES.length > 1);
    lastMsg = i;
    toast(MESSAGES[i]);
  }

  // Composición inicial del ramo
  const INITIAL = [
    { x: 300, y: 170, scale: 1.15, type: "sun" },
    { x: 205, y: 215, scale: .92, type: "daisy" },
    { x: 395, y: 210, scale: .95, type: "cosmos" },
    { x: 130, y: 300, scale: .85, type: "sun" },
    { x: 470, y: 295, scale: .88, type: "sun" },
    { x: 255, y: 290, scale: 1, type: "sun" },
    { x: 355, y: 300, scale: .95, type: "daisy" },
    { x: 180, y: 370, scale: .85, type: "cosmos" },
    { x: 420, y: 375, scale: .82, type: "daisy" },
    { x: 300, y: 385, scale: .95, type: "sun" },
    { x: 150, y: 215, scale: .8, type: "bud" },
    { x: 450, y: 150, scale: .8, type: "bud" },
    { x: 250, y: 130, scale: .75, type: "bud" },
    { x: 360, y: 125, scale: .7, type: "bud" },
    { x: 95, y: 355, scale: .8, type: "bud" },
    { x: 510, y: 345, scale: .8, type: "bud" }
  ];

  // Las flores de más arriba se dibujan primero para que las de abajo queden al frente
  INITIAL
    .map((f, i) => ({ ...f, delay: reduceMotion ? 0 : 0.3 + i * 0.12 }))
    .sort((a, b) => (b.type === "bud") - (a.type === "bud") || a.y - b.y)
    .forEach(addFlower);

  document.getElementById("addFlower").addEventListener("click", () => {
    if (flowerCount >= MAX_FLOWERS) {
      toast("¡El ramo ya está lleno de amor! 💛");
      shower(40);
      return;
    }
    const angle = rand(-1.25, 1.25);
    const radius = rand(170, 260);
    const x = 300 + Math.sin(angle) * radius;
    const y = 440 - Math.cos(angle) * radius;
    addFlower({ x, y, scale: rand(.75, 1.05), type: pick(["sun", "sun", "daisy", "cosmos"]), delay: 0 });
    toast("¡Una flor más para tu ramo! 🌼");
  });

  /* ---------------- Pétalos ---------------- */
  function spawnPetal(x, y, { vx = 0, vy = 0, fall = window.innerHeight, duration = 5000, size = 1 } = {}) {
    if (petalsLayer.childElementCount > 220) return;
    const p = document.createElement("span");
    p.className = "petal";
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.width = 14 * size + "px";
    p.style.height = 22 * size + "px";
    petalsLayer.appendChild(p);

    const rot = rand(-360, 360);
    const drift = rand(-80, 80);
    const anim = p.animate([
      { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${vx * 0.5 + drift * 0.4}px, ${vy * 0.5}px) rotate(${rot * 0.3}deg)`, opacity: 1, offset: 0.15 },
      { transform: `translate(${vx + drift}px, ${fall}px) rotate(${rot}deg)`, opacity: 0 }
    ], { duration, easing: "cubic-bezier(.25,.6,.4,1)" });
    anim.onfinish = () => p.remove();
  }

  function burst(x, y, n) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const speed = rand(60, 160);
      spawnPetal(x, y, {
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed - 60,
        fall: rand(150, 380),
        duration: rand(1800, 3200),
        size: rand(.6, 1)
      });
    }
  }

  function shower(n) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      setTimeout(() => spawnPetal(rand(0, window.innerWidth), -30, {
        fall: window.innerHeight + 60,
        duration: rand(4000, 7500),
        size: rand(.6, 1.1)
      }), i * 60);
    }
  }

  // Pétalos que caen suavemente todo el tiempo
  if (!reduceMotion) {
    setInterval(() => {
      if (document.hidden) return;
      spawnPetal(rand(0, window.innerWidth), -30, {
        fall: window.innerHeight + 60,
        duration: rand(7000, 11000),
        size: rand(.5, .9)
      });
    }, 700);
  }

  document.getElementById("shower").addEventListener("click", () => {
    shower(70);
    toast("Una lluvia de flores amarillas para ti 🌼");
  });

  // Tocar cualquier parte vacía suelta unos pétalos
  document.addEventListener("click", e => {
    if (e.target.closest("button, input, label, .share, .flower")) return;
    burst(e.clientX, e.clientY, 8);
  });

  /* ---------------- Toast ---------------- */
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  /* ---------------- Dedicatoria y enlace ---------------- */
  const params = new URLSearchParams(location.search);
  const toInput = document.getElementById("toInput");
  const fromInput = document.getElementById("fromInput");
  const dedication = document.getElementById("dedication");

  function renderDedication(to, from) {
    dedication.textContent = "";
    if (!to && !from) {
      dedication.textContent = "Un ramo de flores amarillas para ti";
      return;
    }
    const add = (text, strong) => {
      const node = strong ? document.createElement("strong") : document.createTextNode(text);
      if (strong) node.textContent = text;
      dedication.appendChild(node);
    };
    if (to) { add("Para "); add(to, true); }
    if (to && from) add(", con cariño de ");
    else if (from) add("Con cariño de ");
    if (from) add(from, true);
  }

  const initialTo = (params.get("para") || "").slice(0, 40);
  const initialFrom = (params.get("de") || "").slice(0, 40);
  const isRecipient = Boolean(initialTo || initialFrom);
  if (isRecipient) document.body.classList.add("recipient", "waiting");
  toInput.value = initialTo;
  fromInput.value = initialFrom;
  renderDedication(initialTo, initialFrom);

  document.getElementById("shareBtn").addEventListener("click", async () => {
    const to = toInput.value.trim();
    const from = fromInput.value.trim();
    renderDedication(to, from);

    const url = new URL(location.href);
    url.search = "";
    if (to) url.searchParams.set("para", to);
    if (from) url.searchParams.set("de", from);
    history.replaceState(null, "", url);

    const link = url.toString();
    const text = to ? `${to}, te mando unas flores amarillas 🌼` : "Te mando unas flores amarillas 🌼";

    if (navigator.share) {
      try {
        await navigator.share({ title: "Flores amarillas", text, url: link });
        return;
      } catch (err) {
        if (err.name === "AbortError") return;
      }
    }
    try {
      await navigator.clipboard.writeText(link);
      toast("¡Enlace copiado! Ahora envíalo 💛");
    } catch {
      toast("Copia el enlace de la barra del navegador 💛");
    }
    shower(30);
  });

  /* ---------------- Música ---------------- */
  const music = document.getElementById("music");
  const musicBtn = document.getElementById("musicBtn");
  music.volume = 0.8;

  function setMusicUI(playing) {
    musicBtn.classList.toggle("on", playing);
    musicBtn.classList.toggle("off", !playing);
    musicBtn.setAttribute("aria-pressed", String(playing));
    musicBtn.setAttribute("aria-label", playing ? "Pausar música" : "Reproducir música");
  }
  music.addEventListener("play", () => setMusicUI(true));
  music.addEventListener("pause", () => setMusicUI(false));

  const playMusic = () => music.play().catch(() => {});

  musicBtn.addEventListener("click", () => {
    if (music.paused) playMusic();
    else music.pause();
  });

  if (isRecipient) {
    // Pantalla de regalo: el toque del usuario permite que suene la música
    const giftText = document.getElementById("giftText");
    giftText.textContent = "";
    if (initialFrom) {
      const strong = document.createElement("strong");
      strong.textContent = initialFrom;
      giftText.append(strong, " te mandó flores amarillas");
    } else {
      giftText.textContent = "Alguien te mandó flores amarillas";
    }
    if (initialTo) {
      document.getElementById("giftTitle").textContent = `${initialTo}, tienes un regalo`;
    }

    const gift = document.getElementById("gift");
    const openBtn = document.getElementById("openGift");
    openBtn.focus();
    openBtn.addEventListener("click", () => {
      playMusic();
      gift.classList.add("leaving");
      document.body.classList.remove("waiting");
      setTimeout(() => { gift.remove(); shower(40); }, 800);
    }, { once: true });
  } else {
    // Si el navegador bloquea el autoplay, empieza con el primer toque
    music.play().catch(() => {
      const start = e => {
        if (e.target.closest("#musicBtn")) return;
        playMusic();
      };
      document.addEventListener("pointerdown", start, { once: true });
    });
  }
})();
</script>
</body>
</html>
